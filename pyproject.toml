[project]
name = "whetstone"
version = "0.1.0"
description = "Adaptive Codeforces trainer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "numpy>=2.4.6",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "torch>=2.12.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "black>=24"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
